<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BASS Plays — NORTHERN ENTRANCE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
  <script src="/socket.io/socket.io.js"></script>
  <script defer src="/player.js"></script>
  <style>
 .container {
  padding: 4rem 2rem;
 }
 .player-shell {
  background-image: url("images/bgGreen.png");
  background-size: cover;
  background-repeat: no-repeat;
 }
 .footer {
   background-image: url("images/footer-taskbar.png");
  background-size: cover;
  background-repeat: no-repeat;
 }
 .container-wrap {
  background-image: url("images/contentArea-windowsUI.png");
  background-size: cover;
  background-repeat: no-repeat;
  padding: 8rem 2rem;
 }
 
  </style>
</head>

<body data-location="northern">
  <div class="container-fluid mx-auto">
  <main class="player-shell">
    <div class = "container-wrap col-10">
    <div class="kicker">A distributed public game</div>
    <div class="brand">BASS PLAYS</div>
    <div class="subhead">Rock · Paper · Scissors</div>
    <div class="location-title">NORTHERN ENTRANCE</div>
    <p class="prompt">MAKE YOUR CHOICE</p>
    <section class="d-grid col-8 mx-auto" aria-label="Choose rock paper or scissors">
      <button class="choice-button" data-choice="rock"><span class="choice-symbol">✊</span>ROCK</button>
      <button class="choice-button" data-choice="paper"><span class="choice-symbol">✋</span>PAPER</button>
      <button class="choice-button" data-choice="scissors"><span class="choice-symbol">✌</span>SCISSORS</button>
    </section>
    <div class="feedback" id="feedback">
      <strong>MAKE YOUR CHOICE</strong>
      <span>ONE PRESS RECORDS ONE PARTICIPATION</span>
    </div>
    </div>
      </main>
      <footer class="footer mt-auto py-3 bg-light text-center">
      <div class="container"> <!--had player-footer class on it before-->
        <!-- <span class="text-body-secondary">BASS PLAYS: ROCK, PAPER, SCISSORS</span> -->
      </div>
    </footer>



  <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>

</body>
</html>
